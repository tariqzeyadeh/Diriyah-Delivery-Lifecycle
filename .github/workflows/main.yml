name: Diriyah CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: mysql://atlas_user:atlas_secret@127.0.0.1:3306/atlas_db
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  MYSQL_ROOT_PASSWORD: atlas_root_secret
  MYSQL_DATABASE: atlas_db
  MYSQL_USER: atlas_user
  MYSQL_PASSWORD: atlas_secret

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npx prettier --check .

  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atlas_root_secret
          MYSQL_DATABASE: atlas_db
          MYSQL_USER: atlas_user
          MYSQL_PASSWORD: atlas_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -patlas_root_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema (verify DB connectivity)
        run: npx prisma db push

      - name: Build Next.js
        run: npm run build

  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atlas_root_secret
          MYSQL_DATABASE: atlas_db
          MYSQL_USER: atlas_user
          MYSQL_PASSWORD: atlas_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -patlas_root_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply schema & seed demo data
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      IMAGE_NAME: atlas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          LOGIN_SERVER=$(az acr show -n "$AZURE_ACR_NAME" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "image_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$LOGIN_SERVER/$IMAGE_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_latest=$LOGIN_SERVER/$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push image to ACR
        run: |
          az acr login -n "$AZURE_ACR_NAME"
          az acr build \
            --registry "$AZURE_ACR_NAME" \
            --image "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" \
            --image "${IMAGE_NAME}:latest" \
            --file Dockerfile \
            .

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.meta.outputs.image }}" \
            --set-env-vars "CONTAINER_IMAGE_TAG=${{ steps.meta.outputs.image_tag }}"

      - name: Ensure ingress target port 3000
        run: |
          az containerapp ingress update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 3000 \
            --type external

      - name: Restart Container App (new revision active)
        run: |
          az containerapp revision restart \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision $(az containerapp revision list \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[0].name" -o tsv) || true

      - name: Deployment summary
        run: |
          FQDN=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Deployed ${{ steps.meta.outputs.image }}"
          echo "App URL: https://$FQDN"
